name: Update GeoIP ranges

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      - name: Install dependencies
        run: pip install requests

      - name: Cleanup old files
        run: rm -f cidr/*

      - name: Generate CIDR files
        run: |
          mkdir -p cidr
          cd cidr
          python3 ../country_ranges_geoip.py

      - name: Generate HAProxy map
        run: |
          cd cidr
          bash ../geoip.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add cidr

          git diff --cached --quiet && exit 0

          git commit -m "Update GeoIP ranges"

          git push
